name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Executar smoke de staging após o release"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Changesets version + changelog + tag
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Instalar dependências (frozen)
        run: pnpm install --frozen-lockfile

      - name: Configurar git
        run: |
          git config user.name "brocolis-release-bot"
          git config user.email "release@brocolis.ao"

      - name: Changesets (version → changelog → tag)
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset tag && git push --follow-tags origin main
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-staging:
    name: Smoke staging (readiness)
    runs-on: ubuntu-latest
    needs: version
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_smoke || needs.version.outputs.published == 'true' }}
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Smoke tests (health endpoints)
        env:
          SMOKE_API_URL: ${{ vars.STAGING_API_URL || 'https://staging-api.brocolis.ao' }}
          SMOKE_WEB_URL: ${{ vars.STAGING_WEB_URL || 'https://staging.brocolis.ao' }}
        run: node scripts/smoke-staging.mjs
