name: Security

on:
  pull_request:
  schedule:
    # Segundas-feiras 05:00 UTC (antes do supply-chain 06:00)
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo para o gitleaks

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulnerabilities-scan:
    name: Vulnerabilidades (audit + trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Instalar dependências (frozen)
        run: pnpm install --frozen-lockfile

      - name: npm audit (high+)
        run: pnpm audit --audit-level high

      - name: Trivy filesystem scan (código + dependências)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy config scan (infra/ + deploy/)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          input: .
          severity: HIGH,CRITICAL
          exit-code: "1"
