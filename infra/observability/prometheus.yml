# Prometheus (F7) — scrape do exporter OTLP do Collector e métricas nativas
# prom-client da API (blueprint: @brocolis/observability expõe /metrics).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métricas OTLP exportadas pelo Collector (exporters.prometheus :8889)
  - job_name: otel-collector-metrics
    static_configs:
      - targets: ["otel-collector:8889"]

  # Métricas prom-client directas da API NestJS (/metrics)
  - job_name: brocolis-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:4000"]
        labels:
          env: local

  # Health do próprio Collector
  - job_name: otel-collector-health
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]
